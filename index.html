<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2 · Калькулятор Комбо · Переезд</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#2a2a30;color:#fff;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
  position:relative;overflow:hidden;
}
:root{
  --t2-bg:#2a2a30;--t2-card:#35353c;--t2-card-hover:#3d3d45;--t2-card-soft:#2f2f36;
  --t2-border:#44444c;--t2-border-soft:#3a3a42;--t2-text:#ffffff;--t2-text-sub:#d0d0d5;
  --t2-muted:#9a9aa2;--t2-pink:#ff0080;--t2-pink-light:#ff4da6;--t2-pink-soft:rgba(255,0,128,.12);
  --t2-pink-glow:rgba(255,0,128,.35);--t2-pink-border:rgba(255,0,128,.35);
  --benefit-pos:#00d97e;
}
/* фоновые пятна */
body::before, body::after{
  content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(60px);
}
body::before{
  width:600px;height:600px;
  background:radial-gradient(circle,var(--t2-pink-glow) 0%,transparent 70%);
  top:-250px;right:-200px;opacity:.5;
}
body::after{
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(96,165,250,.18) 0%,transparent 70%);
  bottom:-250px;left:-200px;opacity:.6;
}

.card{
  position:relative;z-index:1;
  background:linear-gradient(135deg,rgba(255,0,128,0.10) 0%,var(--t2-card) 100%);
  border:1px solid var(--t2-pink-border);
  border-radius:24px;
  padding:48px 44px 44px;
  max-width:560px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.45), 0 0 80px rgba(255,0,128,.10);
  text-align:center;
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

/* логотип */
.logo-wrap{
  display:flex;align-items:center;justify-content:center;gap:16px;
  margin-bottom:32px;
}
.logo-t2{position:relative;display:flex;align-items:center;gap:14px;text-decoration:none}
.logo-t2__mark{
  width:54px;height:54px;display:flex;align-items:center;justify-content:center;
  position:relative;flex-shrink:0;background:transparent;
}
.logo-t2__mark::before{
  content:'';position:absolute;top:4px;left:2px;width:14px;height:14px;
  background:var(--t2-pink);border-radius:3px;
  box-shadow:0 0 16px var(--t2-pink-glow);
}
.logo-t2__mark span{
  color:#fff;font-weight:900;font-size:34px;font-style:italic;
  letter-spacing:-2.5px;position:relative;z-index:1;
  text-shadow:2px 3px 0 rgba(0,0,0,.9),0 6px 12px rgba(0,0,0,.6);
  background:linear-gradient(180deg,#fff 0%,#c0c0c5 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.logo-t2__text{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.logo-t2__title{font-size:18px;font-weight:900;color:#fff}
.logo-t2__sub{font-size:12px;color:var(--t2-muted);font-weight:600}

/* иконка переезда */
.icon{
  width:80px;height:80px;margin:0 auto 24px;
  border-radius:22px;
  background:var(--t2-pink-soft);
  border:1px solid var(--t2-pink-border);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;line-height:1;
  box-shadow:0 8px 32px rgba(255,0,128,.25);
  position:relative;
}
.icon::after{
  content:'';position:absolute;inset:-4px;border-radius:26px;
  border:1px solid var(--t2-pink-border);
  opacity:.5;animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:.5}
  50%{transform:scale(1.06);opacity:.15}
}

h1{
  font-size:28px;font-weight:900;color:#fff;
  line-height:1.2;margin-bottom:14px;letter-spacing:-.5px;
}
h1 span{color:var(--t2-pink)}
p.lead{
  font-size:15px;color:var(--t2-text-sub);line-height:1.55;
  margin-bottom:8px;
}
p.note{
  font-size:13px;color:var(--t2-muted);line-height:1.5;
  margin-bottom:28px;
}
p.note b{color:#fff;font-weight:700}

/* кнопка */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:16px 24px;
  background:var(--t2-pink);color:#fff;
  border:none;border-radius:14px;
  font-size:16px;font-weight:800;font-family:inherit;
  text-decoration:none;cursor:pointer;
  box-shadow:0 8px 28px rgba(255,0,128,.45);
  transition:all .2s ease;
  position:relative;overflow:hidden;
}
.btn:hover{
  background:var(--t2-pink-light);
  transform:translateY(-2px);
  box-shadow:0 12px 36px rgba(255,0,128,.6);
}
.btn:active{transform:translateY(0)}
.btn__arrow{transition:transform .2s ease}
.btn:hover .btn__arrow{transform:translateX(4px)}

/* прогресс-полоса на кнопке */
.btn__progress{
  position:absolute;left:0;bottom:0;height:3px;width:100%;
  background:rgba(255,255,255,.9);
  transform-origin:left center;
  transform:scaleX(1);
  transition:transform .95s linear;
  border-radius:0 0 14px 14px;
}

/* адрес ссылки под кнопкой */
.url{
  margin-top:16px;font-size:12px;color:var(--t2-muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  word-break:break-all;
}
.url b{color:var(--t2-pink-light);font-weight:700}

/* нижний бейдж */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:28px;padding:8px 14px;
  background:rgba(0,217,126,.12);
  border:1px solid var(--benefit-pos);
  border-radius:999px;
  font-size:11px;font-weight:800;color:var(--benefit-pos);
  letter-spacing:.3px;
  text-transform:uppercase;
}
.badge__dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--benefit-pos);
  box-shadow:0 0 8px var(--benefit-pos);
  animation:blink 1.8s ease-in-out infinite;
}
@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.3}
}

@media(max-width:560px){
  .card{padding:36px 24px 32px;border-radius:20px}
  h1{font-size:22px}
  p.lead{font-size:14px}
  .icon{width:68px;height:68px;font-size:34px;margin-bottom:20px}
  .logo-t2__mark{width:46px;height:46px}
  .logo-t2__mark span{font-size:28px}
  .logo-t2__title{font-size:16px}
  .btn{font-size:15px;padding:14px 20px}
}
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <a class="logo-t2" href="https://calculatorcombo.gkarmada.ru/">
      <div class="logo-t2__mark"><span>t2</span></div>
      <div class="logo-t2__text">
        <div class="logo-t2__title">Акция Комбо</div>
        <div class="logo-t2__sub">Калькулятор остатков</div>
      </div>
    </a>
  </div>

  <div class="icon">🚀</div>

  <h1>Калькулятор <span>переехал</span></h1>
  <p class="lead">Мы обновили адрес. Теперь калькулятор Комбо доступен по новой ссылке.</p>
  <p class="note" id="autoNote">
    Старая страница больше не обновляется. Автоматический переход через <b id="countdown">10</b> сек.
  </p>

  <a class="btn" id="goBtn" href="https://calculatorcombo.gkarmada.ru/" target="_blank" rel="noopener">
    <span id="btnLabel">Перейти на новый адрес</span>
    <span class="btn__arrow">→</span>
    <span class="btn__progress" id="btnProgress"></span>
  </a>

  <div class="url"><b>calculatorcombo.gkarmada.ru</b></div>

  <div class="badge">
    <span class="badge__dot"></span>
    Новый адрес · v2.0
  </div>
</div>

<script>
(function () {
  const TARGET_URL = 'https://calculatorcombo.gkarmada.ru/';
  const TOTAL = 10;

  const countdownEl = document.getElementById('countdown');
  const noteEl = document.getElementById('autoNote');
  const btn = document.getElementById('goBtn');
  const btnLabel = document.getElementById('btnLabel');
  const progress = document.getElementById('btnProgress');

  let remaining = TOTAL;
  let tickId = null;
  let redirected = false;

  // Инициализация прогресс-полосы: стартуем с 100% (scaleX(1))
  // Каждую секунду уменьшаем на 1/TOTAL
  progress.style.transform = 'scaleX(1)';

  function renderLabel() {
    // Пока идёт отсчёт — на кнопке показываем "Переход через N…"
    if (remaining > 0) {
      btnLabel.textContent = 'Переход через ' + remaining + '…';
    } else {
      btnLabel.textContent = 'Перейти на новый адрес';
    }
  }

  function doRedirect() {
    if (redirected) return;
    redirected = true;
    clearInterval(tickId);
    // Заменяем текущую страницу на новую (без записи в историю)
    window.location.replace(TARGET_URL);
  }

  function tick() {
    remaining -= 1;
    if (countdownEl) countdownEl.textContent = remaining > 0 ? remaining : 0;
    renderLabel();

    // Прогресс-полоса: scaleX от 1 → 0
    const ratio = Math.max(0, remaining) / TOTAL;
    progress.style.transform = 'scaleX(' + ratio + ')';

    if (remaining <= 0) {
      clearInterval(tickId);
      doRedirect();
    }
  }

  // Стартовое состояние
  renderLabel();
  tickId = setInterval(tick, 1000);

  // Клик по кнопке — сразу переходим, таймер отменяем
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    doRedirect();
  });
})();
</script>
</body>
</html>
